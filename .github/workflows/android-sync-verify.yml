name: Android sync verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build and sync web assets into Android
        run: npm run cap:sync

      - name: Verify Capacitor web assets
        run: |
          test -f dist/index.html
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/capacitor.config.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug Android APK
        working-directory: android
        run: ./gradlew app:assembleDebug

      - name: Verify debug APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-liquid-glass-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
