<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 177 178" role="img" aria-label="AI study review">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4e7bdc"/>
      <stop offset="1" stop-color="#375fbd"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,.22)"/>
      <stop offset="1" stop-color="rgba(255,255,255,.07)"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
  </defs>
  <rect width="177" height="178" fill="url(#bg)"/>
  <rect x="20" y="20" width="137" height="139" rx="36" fill="url(#glass)" stroke="#a9c6ff" stroke-opacity=".55" stroke-width="3"/>
  <rect x="22" y="22" width="133" height="135" rx="34" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="2"/>
  <circle cx="119" cy="54" r="10" fill="#9defff" filter="url(#soft)" opacity=".65"/>
  <circle cx="119" cy="54" r="9" fill="#9defff"/>
  <circle cx="76" cy="98" r="10" fill="#fff" filter="url(#soft)" opacity=".6"/>
  <circle cx="76" cy="98" r="9" fill="#fff"/>
</svg>
